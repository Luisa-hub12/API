api_platform:
    title: CATAPULT CONNECT
    version: 0.0.1
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        normalization_context:
            skip_null_values: false
    formats:
        json: ['application/json']
    docs_formats:
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    error_formats:
        jsonproblem: ['application/problem+json']
    exception_to_status:
        App\Exception\User\EmailAlreadyUsedException: 409
        App\Exception\City\CityNotFoundException: 422
    swagger:
        http_auth:
            bearerAuth:
                scheme: bearer
                bearerFormat: JWT
        persist_authorization: true
